name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host tests and the development pin (symlink://../hydronode-library) build against the
      # HydroNode-Library checkout next to this repository: same branch name if it exists, else main.
      - name: HydroNode-Library next to the firmware
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$ref" https://github.com/TexhFexLabs/HydroNode-Library.git ../hydronode-library \
            || git clone --depth 1 https://github.com/TexhFexLabs/HydroNode-Library.git ../hydronode-library
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate catalog
        run: node tools/validate-catalog.mjs --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: dist/catalog.json

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Host tests and the development pin (symlink://../hydronode-library) build against the
      # HydroNode-Library checkout next to this repository: same branch name if it exists, else main.
      - name: HydroNode-Library next to the firmware
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$ref" https://github.com/TexhFexLabs/HydroNode-Library.git ../hydronode-library \
            || git clone --depth 1 https://github.com/TexhFexLabs/HydroNode-Library.git ../hydronode-library
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Config parser tests
        run: pio test -e native && pio test -e native-ota
      - name: Release signing regression
        run: python tools/test-sign-release.py

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32, esp32s2, esp32s3, esp32c3, esp32c6, esp8266, scan-esp32, scan-esp32s2, scan-esp32s3, scan-esp32c3, scan-esp32c6, scan-esp8266]
    steps:
      - uses: actions/checkout@v4
      # Host tests and the development pin (symlink://../hydronode-library) build against the
      # HydroNode-Library checkout next to this repository: same branch name if it exists, else main.
      - name: HydroNode-Library next to the firmware
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$ref" https://github.com/TexhFexLabs/HydroNode-Library.git ../hydronode-library \
            || git clone --depth 1 https://github.com/TexhFexLabs/HydroNode-Library.git ../hydronode-library
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build
        run: pio run -e ${{ matrix.env }}
      - name: Image fits 85 % of the OTA slot
        run: python tools/check-image-size.py ${{ matrix.env }}
      - name: License gate
        run: node tools/license-check.mjs --env ${{ matrix.env }} --out dist/THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/*.bin
            dist/THIRD_PARTY_LICENSES.md
