; HydroNode universal firmware.
;
; One binary per chip family. Everything board specific (sensors, pins, sleep
; mode, WiFi, credentials) comes from the "hncfg" partition that the web
; flasher writes next to the app. See catalog/ and README.md.
;
; Every version is pinned on purpose: a release must be reproducible, and the
; LGPL-2.1 Arduino core has to be rebuildable by anyone from this exact source.

[platformio]
default_envs = esp32, esp32s2, esp32s3, esp32c3, esp32c6, esp8266

[hydronode]
version = 0.1.2

[esp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions/hydronode_4mb.csv
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++2a
    -DHN_FW_VERSION=\"${hydronode.version}\"
    -DCORE_DEBUG_LEVEL=0
; Keep this list in sync with catalog/licenses.json — tools/license-check.mjs
; refuses to build a release with anything that is not listed there.
; DallasTemperature pulls in PaulStoffregen/OneWire, which does not build for the
; ESP32-C6 on core 3.x. OneWireNg ships a compatible OneWire.h and replaces it.
lib_ignore = OneWire
lib_deps =
    texhfexlabs/HydroNode-Library@1.3.0
    bblanchon/ArduinoJson@7.4.3
    arduino-libraries/ArduinoHttpClient@0.6.2
    arduino-libraries/NTPClient@3.2.1
    tzapu/WiFiManager@2.0.17
    pstolarz/OneWireNg@0.14.1
    milesburton/DallasTemperature@4.0.6
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    sensirion/Sensirion Core@0.7.3
    sensirion/Sensirion I2C SHT4x@1.1.2
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit HTU21DF Library@1.1.2
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit BMP280 Library@3.0.0
    claws/BH1750@1.3.0

[env:esp32]
extends = esp
board = esp32dev
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32\"

[env:esp32s2]
extends = esp
board = esp32-s2-saola-1
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32s2\" -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
extends = esp
board = esp32-s3-devkitc-1
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32s3\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
extends = esp
board = esp32-c3-devkitm-1
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32c3\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
extends = esp
board = esp32-c6-devkitc-1
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32c6\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ESP8266 (4 MB boards: NodeMCU, D1 mini). Espressif's ESP8266 Arduino core, LGPL-2.1.
; HydroNode-Library gains ESP8266 support in 1.4.0; until that is released it comes from the
; sibling checkout. Every other library must stay identical to [esp] (validate-catalog checks it).
[env:esp8266]
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
build_unflags = ${esp.build_unflags}
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp8266\"
lib_ignore = ${esp.lib_ignore}
lib_deps =
    https://github.com/TexhFexLabs/HydroNode-Library.git#1.4.1
    bblanchon/ArduinoJson@7.4.3
    arduino-libraries/ArduinoHttpClient@0.6.2
    arduino-libraries/NTPClient@3.2.1
    tzapu/WiFiManager@2.0.17
    pstolarz/OneWireNg@0.14.1
    milesburton/DallasTemperature@4.0.6
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    sensirion/Sensirion Core@0.7.3
    sensirion/Sensirion I2C SHT4x@1.1.2
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit HTU21DF Library@1.1.2
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit BMP280 Library@3.0.0
    claws/BH1750@1.3.0

; Host tests for the parts that do not touch hardware (config parser, planner).
[env:native]
platform = native
build_flags = -std=c++17 -DHN_NATIVE_TEST
lib_deps = bblanchon/ArduinoJson@7.4.3
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<config/>
