; HydroNode universal firmware.
;
; One binary per chip family. Everything board specific (sensors, pins, sleep
; mode, WiFi, credentials) comes from the "hncfg" partition that the web
; flasher writes next to the app. See catalog/ and README.md.
;
; Every version is pinned on purpose: a release must be reproducible, and the
; LGPL-2.1 Arduino core has to be rebuildable by anyone from this exact source.

[platformio]
default_envs = esp32, esp32s2, esp32s3, esp32c3, esp32c6, esp8266, scan-esp32, scan-esp32s2, scan-esp32s3, scan-esp32c3, scan-esp32c6, scan-esp8266

[hydronode]
version = 0.3.0

[esp]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions/hydronode_4mb.csv
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++2a
    -DHN_FW_VERSION=\"${hydronode.version}\"
    -DCORE_DEBUG_LEVEL=0
; The I²C/1-Wire scanner lives in src/scanner and is built by the scan-* environments only.
build_src_filter = +<*> -<scanner/>
; Keep this list in sync with catalog/licenses.json — tools/license-check.mjs
; refuses to build a release with anything that is not listed there.
; DallasTemperature pulls in PaulStoffregen/OneWire, which does not build for the
; ESP32-C6 on core 3.x. OneWireNg ships a compatible OneWire.h and replaces it.
lib_ignore = OneWire
lib_deps =
    https://github.com/TexhFexLabs/HydroNode-Library.git#1.5.0
    bblanchon/ArduinoJson@7.4.3
    arduino-libraries/ArduinoHttpClient@0.6.2
    arduino-libraries/NTPClient@3.2.1
    tzapu/WiFiManager@2.0.17
    pstolarz/OneWireNg@0.14.1
    milesburton/DallasTemperature@4.0.6
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    sensirion/Sensirion Core@0.7.3
    sensirion/Sensirion I2C SHT4x@1.1.2
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit HTU21DF Library@1.1.2
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit BMP280 Library@3.0.0
    claws/BH1750@1.3.0
    adafruit/Adafruit BME680 Library@2.0.6
    adafruit/Adafruit SGP30 Sensor@2.0.3
    adafruit/Adafruit SGP40 Sensor@1.1.4
    sensirion/Sensirion I2C SGP41@1.0.0
    sensirion/Sensirion Gas Index Algorithm@3.2.3
    sensirion/Sensirion I2C SCD4x@1.1.0
    adafruit/Adafruit VEML7700 Library@2.1.6
    adafruit/Adafruit INA219@1.2.3
    adafruit/Adafruit MS8607@1.0.4
    adafruit/Adafruit BMP3XX Library@2.1.6
    adafruit/Adafruit DPS310@1.1.6
    adafruit/Adafruit LPS2X@2.0.6
    adafruit/Adafruit SHTC3 Library@1.0.2
    adafruit/Adafruit MCP9808 Library@2.0.2
    adafruit/Adafruit TMP117@1.0.5
    adafruit/Adafruit TSL2591 Library@1.4.5
    adafruit/Adafruit LTR390 Library@1.1.2
    adafruit/Adafruit SCD30@1.0.11
    adafruit/Adafruit PM25 AQI Sensor@2.0.0
    sensirion/Sensirion I2C SEN5X@0.3.0
    robtillaart/INA226@0.6.6
    adafruit/Adafruit INA260 Library@1.5.3
    adafruit/Adafruit ADS1X15@2.6.2
    pololu/VL53L0X@1.3.1

[env:esp32]
extends = esp
board = esp32dev
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32\"

[env:esp32s2]
extends = esp
board = esp32-s2-saola-1
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32s2\" -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
extends = esp
board = esp32-s3-devkitc-1
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32s3\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
extends = esp
board = esp32-c3-devkitm-1
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32c3\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
extends = esp
board = esp32-c6-devkitc-1
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp32c6\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ESP8266 (4 MB boards: NodeMCU, D1 mini). Espressif's ESP8266 Arduino core, LGPL-2.1.
; Same libraries as [esp] (validate-catalog checks it).
[env:esp8266]
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini
board_build.ldscript = eagle.flash.4m1m.ld
; 160 MHz: a TLS handshake takes 3 s instead of 5.5 s, so the board is awake for a shorter time.
board_build.f_cpu = 160000000L
monitor_speed = 115200
build_unflags = ${esp.build_unflags}
build_flags = ${esp.build_flags} -DHN_FAMILY=\"esp8266\"
lib_ignore = ${esp.lib_ignore}
lib_deps = ${esp.lib_deps}
build_src_filter = ${esp.build_src_filter}

; I²C and 1-Wire scanner, flashed from the wiring step to find what is connected. Same chip
; settings as the firmware, but only the scanner source and OneWireNg.
[scan]
build_src_filter = -<*> +<scanner/>
lib_ignore = OneWire
lib_deps = pstolarz/OneWireNg@0.14.1

[env:scan-esp32]
extends = env:esp32
build_src_filter = ${scan.build_src_filter}
lib_deps = ${scan.lib_deps}

[env:scan-esp32s2]
extends = env:esp32s2
build_src_filter = ${scan.build_src_filter}
lib_deps = ${scan.lib_deps}

[env:scan-esp32s3]
extends = env:esp32s3
build_src_filter = ${scan.build_src_filter}
lib_deps = ${scan.lib_deps}

[env:scan-esp32c3]
extends = env:esp32c3
build_src_filter = ${scan.build_src_filter}
lib_deps = ${scan.lib_deps}

[env:scan-esp32c6]
extends = env:esp32c6
build_src_filter = ${scan.build_src_filter}
lib_deps = ${scan.lib_deps}

[env:scan-esp8266]
extends = env:esp8266
build_src_filter = ${scan.build_src_filter}
lib_deps = ${scan.lib_deps}

; Host tests for the parts that do not touch hardware (config parser, planner).
[env:native]
platform = native
build_flags = -std=c++17 -DHN_NATIVE_TEST
lib_deps = bblanchon/ArduinoJson@7.4.3
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<config/>
